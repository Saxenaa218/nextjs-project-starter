version: '3.8'

services:
  video-compressor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MAX_FILE_SIZE=524288000
      - UPLOAD_DIR=./uploads
      - COMPRESSED_DIR=./compressed
      - JOB_TIMEOUT=1800000
    volumes:
      - ./uploads:/app/uploads
      - ./compressed:/app/compressed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
